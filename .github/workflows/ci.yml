name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: external link rot check (docs job) + matrix canary

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs gates (lint, links, mapping, markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Markdownlint
        run: npx -y markdownlint-cli2 "**/*.md"
      - name: PHP structure smoke test (no PHP runtime needed)
        run: node scripts/php-smoke.mjs
      - name: Internal links & anchors
        run: node scripts/check-links.mjs
      - name: Chapter <-> harness example mapping
        run: node scripts/check-example-mapping.mjs
      - name: VERIFY markers (strict on main)
        run: node scripts/check-verify-markers.mjs

  examples:
    name: Harness — Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: "^10.0", php: "8.2", testbench: "^8.0" }
          - { laravel: "^11.0", php: "8.2", testbench: "^9.0" }
          - { laravel: "^12.0", php: "8.3", testbench: "^10.0" }
          - { laravel: "^13.0", php: "8.3", testbench: "^11.0" }
    defaults:
      run:
        working-directory: examples
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, redis
          coverage: none
      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          # composer.lock is not committed (the matrix re-resolves per cell);
          # composer.json hash is the honest cache key.
          key: composer-${{ matrix.php }}-${{ hashFiles('examples/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-interaction --no-progress
      - name: Run harness
        run: vendor/bin/pest --ci
      - name: Static analysis (PHPStan, baseline-gated)
        if: matrix.laravel == '^12.0'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  dependency-audit:
    name: Dependency audit (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer audit

  external-links:
    name: External link check (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --max-retries 2
            --exclude '^https://github\.com/.*/(issues|pull)/'
            './**/*.md'
          fail: true

  dco:
    name: DCO (Signed-off-by on every PR commit)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify every commit carries Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          missing=""
          for sha in $(git rev-list "$base..$HEAD_SHA" --no-merges); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q .; then
              missing="$missing $sha"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Commits missing 'Signed-off-by' (add with: git commit --amend -s, or git rebase --signoff):"
            for sha in $missing; do git show -s --format='  %h %s' "$sha"; done
            exit 1
          fi
